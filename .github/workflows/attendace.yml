name: HROne Attendance Bot

on:
    schedule:
        # Runs at 10:27 AM IST (Check In) - Monday to Friday
        - cron: "57 4 * * 1-5"

        # Runs at 10:27 PM IST (Check Out) - Monday to Friday
        - cron: "57 16 * * 1-5"

    # Allows you to run this manually from the Actions tab for testing
    workflow_dispatch:

jobs:
    mark-attendance:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.9"

            - name: Install Dependencies
              run: |
                  pip install -r requirements.txt

            - name: Run Attendance Script
              env:
                  HRONE_URL: ${{ secrets.HRONE_URL}}
                  HRONE_USER: ${{ secrets.HRONE_USER }}
                  HRONE_PASS: ${{ secrets.HRONE_PASS }}
                  LATITUDE: ${{ secrets.LATITUDE }}
                  LONGITUDE: ${{ secrets.LONGITUDE }}
                  PYTHONUNBUFFERED: "1"
              run: python attendance_bot.py
